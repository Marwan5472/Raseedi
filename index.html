<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ═══════════════ إعدادات Supabase ═══════════════
const SUPABASE_URL = "https://bcclhqbhhartirsznwnc.supabase.co";
const SUPABASE_KEY = "sb_publishable_EPfKg8XC2sJ320dn3krssw_R6wG1U50";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CUR = "ر.س";
const LIQUID = ["نقد", "حساب بنكي"];

// تصنيف الأصل الذي تعرضه بطاقة «الادخار»
const SAVINGS_CAT = "ادخار ارامكو";

// اسم هدف الادخار المؤقت — غيّره من هنا لو تغيّر الهدف
const POT_NAME = "مدخر الزواج";
const POT_COLOR = "#DB2777";
const POT_SOFT = "#FCE7F3";

const SALARY_COLOR = "#4F46E5";
const SALARY_SOFT = "#E0E7FF";
const SALARY_TAG = "راتب ";   // بادئة الملاحظة التي تُبنى منها ذاكرة الراتب
const COMMIT_TAG = "التزام: ";  // بادئة ملاحظة تسديد الالتزامات الثابتة

const TYPES = {
  income:  { label: "دخل",   color: "#0E9F6E", soft: "#E3F5EC", sign: +1, icon: "📉" },
  expense: { label: "مصروف", color: "#E02424", soft: "#FDECEC", sign: -1, icon: "📈" },
  asset:   { label: "أصل",   color: "#1C64F2", soft: "#E5EEFE", sign: +1, icon: "👛" },
  debt:    { label: "دين",   color: "#9061F9", soft: "#F0EAFE", sign: -1, icon: "💳" },
};

const CATS = {
  income:  ["استثمار", "هدية", "سلف", "أخرى"],
  expense: ["إيجار", "طعام", "مواصلات", "فواتير", "تسوق", "صحة", "ترفيه", "تسليف", "زكاة", "أخرى"],
  asset:   ["نقد", "استثمارات", "عقار", "سيارة", "ادخار ارامكو", "اسهم ارامكو", "أخرى"],
  debt:    ["قرض بنكي", "قرض عقاري", "دين شخصي", "تابي", "تمارا", "جمعية", "أخرى"],
};

const fmt = (n) => new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 })
  .format(Math.round((Number(n) || 0) * 100) / 100);
const today = () => new Date().toISOString().slice(0, 10);
const pad2 = (n) => String(n).padStart(2, "0");


// ═══════════════ ذاكرة الراتب ═══════════════
// تُبنى من آخر راتب محفوظ — لا تحتاج جدولاً إضافياً
const salaryMonthOf = (note) => {
  const s = String(note || "");
  return s.startsWith(SALARY_TAG) ? s.slice(SALARY_TAG.length, SALARY_TAG.length + 7) : null;
};

function lastSalary(txns) {
  const rows = txns.filter((t) => /^\d{4}-\d{2}$/.test(salaryMonthOf(t.note) || ""));
  if (!rows.length) return null;
  const latest = rows.map((t) => salaryMonthOf(t.note)).sort().reverse()[0];
  const batch = rows.filter((t) => salaryMonthOf(t.note) === latest);
  const assetCats = batch.filter((t) => t.type === "asset").map((t) => t.category);
  return {
    month: latest,
    income: batch.filter((t) => t.type === "income")
      .map((t) => ({ name: t.category, amount: String(Number(t.amount)) })),
    expense: batch.filter((t) => t.type === "expense")
      .map((t) => ({ name: t.category, amount: String(Number(t.amount)),
                     toAsset: assetCats.includes(t.category) })),
  };
}


// ═══════════════ حساب موعد القسط ═══════════════
const DAY_MS = 86400000;
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const isoOf = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());

// يوم القسط داخل الشهر، مع تقصيره لآخر يوم إن كان الشهر أقصر (فبراير مثلاً)
const dueDateFor = (y, m, day) =>
  new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));

// يوم القسط للقرض — من due_day، وإن لم يوجد فمن يوم تاريخ البداية
const dayOfDebt = (d) => {
  const n = Number(d.due_day);
  if (n >= 1 && n <= 31) return n;
  const fromStart = Number(String(d.start_date || "").slice(8, 10));
  return fromStart >= 1 && fromStart <= 31 ? fromStart : 1;
};

const daysTxt = (n) =>
  n === 1 ? "يوم واحد" : n === 2 ? "يومين" : n <= 10 ? n + " أيام" : n + " يوماً";

// حالة القسط الحالية: مسدد / اليوم / متأخر / قادم
function dueInfo(debt, txns) {
  const day = dayOfDebt(debt);
  const now = startOfDay(new Date());
  const y = now.getFullYear(), m = now.getMonth();
  const thisMonth = dueDateFor(y, m, day);
  const passed = thisMonth.getTime() <= now.getTime();
  const cycleStart = passed ? thisMonth : dueDateFor(y, m - 1, day);
  const nextMonth = passed ? dueDateFor(y, m + 1, day) : thisMonth;

  const startIso = isoOf(cycleStart);
  const paid = txns.some(
    (t) => t.is_installment && t.debt_id === debt.id && t.txn_date >= startIso
  );

  if (paid) {
    const n = Math.round((nextMonth - now) / DAY_MS);
    return { day, status: "paid", color: "#0E9F6E", soft: "#E3F5EC",
      text: "قسط هذا الشهر مسدد · القادم بعد " + daysTxt(n) };
  }

  const diff = Math.round((thisMonth - now) / DAY_MS);
  if (diff === 0)
    return { day, status: "today", color: "#9061F9", soft: "#F0EAFE",
      text: "موعد القسط اليوم" };
  if (diff < 0)
    return { day, status: "late", color: "#E02424", soft: "#FDECEC",
      text: "تأخّر القسط " + daysTxt(-diff) };
  return { day, status: "soon",
    color: diff <= 5 ? "#B45309" : "#57534e",
    soft:  diff <= 5 ? "#FEF3C7" : "#f2f1ee",
    text: "بقي " + daysTxt(diff) + " على القسط" };
}


// ═══════════════ محلّل الرسائل البنكية ═══════════════
const MERCHANT_MAP = [
  [/ejar|إيجار/i, "إيجار"],
  [/zain|stc|mobily|اتصالات|كهرباء|مياه|سداد|fatora|salik/i, "فواتير"],
  [/playstation|netflix|spotify|shahid|osn|steam|xbox|game|cinema|vox|muvi/i, "ترفيه"],
  [/amazon|noon|shein|namshi|ikea|jarir|extra|carrefour|panda|othaim|tamimi|lulu|danube|nice one|sephora/i, "تسوق"],
  [/uber|careem|jeeny|petro|aldrees|sasco|naqel|fuel|parking|بترول|محطة|وقود|مواقف/i, "مواصلات"],
  [/hunger|jahez|marsool|toyou|cafe|coffee|restaurant|kudu|albaik|herfy|mcdonald|kfc|starbucks|barn|dunkin|bakery|shawarma|مطعم|كافيه|قهوة/i, "طعام"],
  [/pharm|nahdi|dawaa|hospital|clinic|dental|lab|صيدلية|مستشفى|عيادة|مختبر/i, "صحة"],
];

function guessCategory(type, merchant, text) {
  // الراتب له شاشته الخاصة — لا يُصنَّف هنا
  if (type === "income") return "أخرى";
  const hay = (merchant || "") + " " + (text || "");
  for (const [re, cat] of MERCHANT_MAP) if (re.test(hay)) return cat;
  if (/نقاط بيع|نقاط البيع|شراء/.test(text)) return "تسوق";
  return "أخرى";
}

function parseOne(raw) {
  if (!raw || !raw.trim()) return null;
  let t = raw.replace(/\u0640/g, "").trim();
  if (!t) return null;

  // الرسوم (تُستخرج وتُزال حتى لا تختلط بالمبلغ)
  let fee = 0;
  const feeM = t.match(/(?:ال)?رسوم\s*:?\s*(?:SAR|SR)?\s*([\d,]+(?:\.\d+)?)\s*(?:SAR|SR)?/);
  if (feeM) { fee = parseFloat(feeM[1].replace(/,/g, "")) || 0; t = t.replace(feeM[0], " "); }

  // إزالة رصيد الحساب حتى لا يُقرأ كمبلغ العملية
  let body = t.replace(/رصيد\s*:?\s*[\d,]+(?:\.\d+)?/g, " ");

  // المبلغ — أولوية للعملة الأجنبية: 8.99 USD (33.76 SAR)
  let amount = null, fx = null;
  const fxM = body.match(/([\d,]+(?:\.\d+)?)\s*([A-Z]{3})\s*\(\s*([\d,]+(?:\.\d+)?)\s*(?:SAR|SR)\s*\)/);
  if (fxM && fxM[2] !== "SAR" && fxM[2] !== "SR") {
    amount = parseFloat(fxM[3].replace(/,/g, ""));
    fx = fxM[1] + " " + fxM[2];
  }
  if (amount == null) {
    const a1 = body.match(/([\d,]+(?:\.\d+)?)\s*(?:SAR|SR)\b/);
    const a2 = body.match(/(?:SAR|SR)\s*([\d,]+(?:\.\d+)?)/);
    const i1 = a1 ? body.indexOf(a1[0]) : Infinity;
    const i2 = a2 ? body.indexOf(a2[0]) : Infinity;
    if (a1 && i1 <= i2) amount = parseFloat(a1[1].replace(/,/g, ""));
    else if (a2) amount = parseFloat(a2[1].replace(/,/g, ""));
  }
  if (amount == null || !(amount > 0)) return null;

  // الاتجاه — أول كلمة مفتاحية تظهر في النص
  const INC = ["واردة", "وارد", "إيداع", "ايداع", "راتب", "استرجاع", "استرداد", "مسترد", "دائن"];
  const EXP = ["صادرة", "صادر", "شراء", "سحب", "سداد", "خصم", "مدين", "دفع"];
  let type = "expense", best = Infinity;
  for (const k of INC) { const i = body.indexOf(k); if (i >= 0 && i < best) { best = i; type = "income"; } }
  for (const k of EXP) { const i = body.indexOf(k); if (i >= 0 && i < best) { best = i; type = "expense"; } }

  // الجهة
  let merchant = "";
  const mM = body.match(/لدى\s*:?\s*(.+)/);
  if (mM) merchant = mM[1];
  merchant = merchant.replace(/[×;]+/g, " ").replace(/\s+/g, " ").trim();

  // التاريخ
  let date = null;
  const iso = body.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (iso) date = iso[1] + "-" + iso[2] + "-" + iso[3];
  else {
    const d2 = body.match(/(\d{2})\/(\d{1,2})\/(\d{1,2})/);
    if (d2) date = "20" + d2[1] + "-" + pad2(d2[2]) + "-" + pad2(d2[3]);
  }
  if (!date) date = today();

  const internal = /داخلية/.test(body) && /حوالة/.test(body);
  const category = guessCategory(type, merchant, body);
  let note = merchant || (/حوالة/.test(body) ? "حوالة" : "");
  if (fx) note += " (" + fx + ")";

  return { type, amount, fee, category, date, note: note.trim(), internal };
}

function parseMany(text) {
  const chunks = String(text || "")
    .split(/\n\s*[-—–_=]{2,}\s*\n|\n{2,}/)
    .map((c) => c.trim())
    .filter((c) => /\d/.test(c) && c.replace(/[-—–_=\s]/g, "").length > 3);

  const out = [];
  chunks.forEach((c, idx) => {
    const r = parseOne(c);
    if (!r) return;
    out.push({ ...r, key: "p" + idx, on: true });
    if (r.fee > 0) out.push({
      type: "expense", amount: r.fee, fee: 0, category: "فواتير",
      date: r.date, note: "رسوم بنكية", internal: false, key: "f" + idx, on: true,
    });
  });
  return out;
}

function Root() {
  const [session, setSession] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setChecking(false);
    });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (checking) return <div id="loading">جارٍ التحقق…</div>;
  if (!session) return <Auth />;
  return <App session={session} />;
}


// ═══════════════ تسجيل الدخول ═══════════════
function Auth() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr(""); setOk("");
    if (!email.trim() || pass.length < 6) {
      setErr("أدخل بريداً صحيحاً وكلمة مرور من 6 أحرف على الأقل");
      return;
    }
    setBusy(true);
    try {
      if (mode === "signup") {
        const { error } = await sb.auth.signUp({ email: email.trim(), password: pass });
        if (error) throw error;
        setOk("تم إنشاء الحساب! جارٍ الدخول…");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
        if (error) throw error;
      }
    } catch (e) {
      const m = e.message || "";
      if (m.includes("Invalid login")) setErr("البريد أو كلمة المرور غير صحيحة");
      else if (m.includes("already registered")) setErr("هذا البريد مسجّل مسبقاً — سجّل دخولك");
      else if (m.includes("Email not confirmed")) setErr("لم يُؤكَّد البريد. أوقف خيار Confirm email في Supabase");
      else setErr(m || "حدث خطأ، حاول مرة أخرى");
    }
    setBusy(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-logo">💰</div>
      <div className="auth-title">رصيدي</div>
      <div className="auth-sub">نظام مالي شخصي — بياناتك محفوظة في السحابة</div>

      <div className="auth-card">
        <div className="auth-tabs">
          <button className={"auth-tab" + (mode === "login" ? " on" : "")}
            onClick={() => { setMode("login"); setErr(""); setOk(""); }}>تسجيل الدخول</button>
          <button className={"auth-tab" + (mode === "signup" ? " on" : "")}
            onClick={() => { setMode("signup"); setErr(""); setOk(""); }}>حساب جديد</button>
        </div>

        {err && <div className="auth-err">{err}</div>}
        {ok && <div className="auth-ok">{ok}</div>}

        <label className="field">
          <span className="field-label">البريد الإلكتروني</span>
          <input className="input" type="email" inputMode="email" value={email} dir="ltr"
            onChange={(e) => setEmail(e.target.value)} placeholder="name@example.com" />
        </label>
        <label className="field">
          <span className="field-label">كلمة المرور</span>
          <input className="input" type="password" value={pass} dir="ltr"
            onChange={(e) => setPass(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="••••••" />
        </label>
        <button className="submit" style={{ background: "#1a1a2e" }} onClick={submit} disabled={busy}>
          {busy ? "جارٍ…" : mode === "signup" ? "إنشاء الحساب" : "دخول"}
        </button>
      </div>
      <div className="sync">بياناتك خاصة بك وحدك ومحمية بسياسات أمان</div>
    </div>
  );
}

function App({ session }) {
  const uid = session.user.id;
  const [txns, setTxns] = useState([]);
  const [debts, setDebts] = useState([]);
  const [commits, setCommits] = useState([]);
  const [commitErr, setCommitErr] = useState(false);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const timer = useRef(null);

  const flash = useCallback((m) => {
    setToast(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), 2800);
  }, []);

  const fetchAll = useCallback(async () => {
    const [t, d, c] = await Promise.all([
      sb.from("transactions").select("*").order("txn_date", { ascending: false }),
      sb.from("debts").select("*").order("created_at", { ascending: false }),
      sb.from("commitments").select("*").order("created_at", { ascending: true }),
    ]);
    if (t.error) flash("تعذّر جلب العمليات");
    if (d.error) flash("تعذّر جلب القروض");
    setTxns(t.data || []);
    setDebts(d.data || []);
    setCommits(c.data || []);
    setCommitErr(!!c.error);
    setLoading(false);
  }, [flash]);

  useEffect(() => { fetchAll(); }, [fetchAll]);

  const addTxn = async (t) => {
    const { error } = await sb.from("transactions").insert({
      user_id: uid, type: t.type, category: t.category,
      amount: t.amount, txn_date: t.date, note: t.note || null,
      pot: t.pot || null,
    });
    if (error) return flash("تعذّرت الإضافة: " + error.message);
    flash(t.pot === "pay" ? "سُجّل ودُفع من المدخر 💍" : "تمت الإضافة");
    fetchAll();
  };

  // حفظ الراتب: بنود دخل + خصومات، والخصم المؤشَّر يُضاف كأصل تلقائياً
  const addSalary = async (rows, date) => {
    const note = SALARY_TAG + String(date).slice(0, 7);
    const payload = [];
    rows.income.forEach((r) => payload.push({
      user_id: uid, type: "income", category: r.name,
      amount: r.amount, txn_date: date, note,
    }));
    rows.expense.forEach((r) => {
      payload.push({
        user_id: uid, type: "expense", category: r.name,
        amount: r.amount, txn_date: date, note: note + " — خصم",
      });
      if (r.toAsset) payload.push({
        user_id: uid, type: "asset", category: r.name,
        amount: r.amount, txn_date: date, note: note + " — تحويل تلقائي",
      });
    });
    if (!payload.length) return;
    const { error } = await sb.from("transactions").insert(payload);
    if (error) return flash("تعذّر الحفظ: " + error.message);
    flash("سُجّل الراتب ✅");
    fetchAll();
  };

  // إضافة دفعة واحدة من الرسائل البنكية
  const addBatch = async (rows) => {
    if (!rows.length) return;
    const payload = rows.map((r) => ({
      user_id: uid, type: r.type, category: r.category,
      amount: Number(r.amount), txn_date: r.date, note: r.note || null,
    }));
    const { error } = await sb.from("transactions").insert(payload);
    if (error) return flash("تعذّرت الإضافة: " + error.message);
    flash("أُضيفت " + rows.length + " عملية ✅");
    fetchAll();
  };

  // تحويل إلى المدخر أو سحب منه — حركة داخلية لا تُحسب دخلاً ولا مصروفاً
  const movePot = async (mode, amount, date, note) => {
    const row = mode === "in"
      ? { type: "expense", category: "ادخار", pot: "in" }
      : { type: "income", category: "سحب من المدخر", pot: "out" };
    const { error } = await sb.from("transactions").insert({
      user_id: uid, ...row, amount, txn_date: date, note: note || null,
    });
    if (error) return flash("تعذّر الحفظ: " + error.message);
    flash(mode === "in" ? "أُضيف إلى " + POT_NAME + " 💍" : "تم السحب من المدخر");
    fetchAll();
  };

  const removeTxn = async (t) => {
    const { error } = await sb.from("transactions").delete().eq("id", t.id);
    if (error) return flash("تعذّر الحذف");
    fetchAll();
  };

  const addDebt = async (d) => {
    const { error } = await sb.from("debts").insert({
      user_id: uid, name: d.name, category: d.category,
      principal: d.principal, monthly: d.monthly, start_date: d.date,
      due_day: d.due_day,
    });
    if (error) return flash("تعذّرت الإضافة: " + error.message);
    flash("تمت إضافة القرض"); fetchAll();
  };

  const removeDebt = async (id) => {
    const { error } = await sb.from("debts").delete().eq("id", id);
    if (error) return flash("تعذّر الحذف");
    fetchAll();
  };

  const saveDueDay = async (id, day) => {
    const { error } = await sb.from("debts").update({ due_day: day }).eq("id", id);
    if (error) return flash("تعذّر الحفظ: " + error.message);
    flash("تم تحديث موعد القسط"); fetchAll();
  };

  const addCommit = async (c) => {
    const { error } = await sb.from("commitments").insert({
      user_id: uid, name: c.name, amount: c.amount, due_day: c.due_day,
    });
    if (error) return flash("تعذّرت الإضافة: " + error.message);
    flash("أُضيف الالتزام"); fetchAll();
  };

  const removeCommit = async (id) => {
    const { error } = await sb.from("commitments").delete().eq("id", id);
    if (error) return flash("تعذّر الحذف");
    fetchAll();
  };

  // تسديد التزام ثابت — يُسجَّل مصروفاً ويُخصم من رصيد الصرف
  const payCommit = async (c, amount, date) => {
    const { error } = await sb.from("transactions").insert({
      user_id: uid, type: "expense", category: c.name,
      amount, txn_date: date, note: COMMIT_TAG + c.name,
    });
    if (error) return flash("تعذّر التسديد: " + error.message);
    flash("سُدّد " + c.name + " ✅");
    fetchAll();
  };

  const remainingOf = useCallback((d) => {
    const paid = txns
      .filter((t) => t.is_installment && t.debt_id === d.id)
      .reduce((a, t) => a + Number(t.amount), 0);
    return Math.max(0, Number(d.principal) - paid);
  }, [txns]);

  const payInstallment = async (debtId, amount, date) => {
    const debt = debts.find((d) => d.id === debtId);
    if (!debt) return;
    const rem = remainingOf(debt);
    const paid = Math.min(amount, rem);
    const { error } = await sb.from("transactions").insert({
      user_id: uid, type: "expense", category: "قسط", amount: paid,
      txn_date: date, note: debt.name, debt_id: debtId, is_installment: true,
    });
    if (error) return flash("تعذّر السداد: " + error.message);
    flash(rem - paid <= 0 ? "تم سداد القرض بالكامل 🎉" : "تم سداد القسط");
    fetchAll();
  };

  const s = useMemo(() => {
    const sum = (f) => txns.filter(f).reduce((a, t) => a + Number(t.amount), 0);

    // الدخل والمصروف الحقيقيان — حركات المدخر الداخلية مستثناة
    const income  = sum((t) => t.type === "income"  && !t.pot);
    const expense = sum((t) => t.type === "expense" && (!t.pot || t.pot === "pay"));

    const liquidTx = sum((t) => t.type === "asset" && LIQUID.includes(t.category));
    const savings  = sum((t) => t.type === "asset" && t.category === SAVINGS_CAT);
    const fixed    = sum((t) => t.type === "asset"
      && !LIQUID.includes(t.category) && t.category !== SAVINGS_CAT);

    // المدخر المؤقت = المُحوَّل إليه − المسحوب منه − المدفوع منه
    const pot = sum((t) => t.pot === "in") - sum((t) => t.pot === "out") - sum((t) => t.pot === "pay");

    const totalLiquid = liquidTx + income - expense;   // كل السيولة (متاح + مدخر)
    const spendable = totalLiquid - pot;               // المتاح للصرف فعلاً

    const commitFixed = commits.reduce((a, c) => a + Number(c.amount), 0);
    const commitLoans = debts
      .filter((d) => remainingOf(d) > 0)
      .reduce((a, d) => a + Number(d.monthly || 0), 0);

    return {
      income, expense, totalLiquid, spendable, pot, savings, fixed,
      commitFixed, commitLoans, commitment: commitFixed + commitLoans,
    };
  }, [txns, debts, commits, remainingOf]);

  // كل قرض مع المتبقي وحالة موعد قسطه
  const debtsView = useMemo(
    () => debts.map((d) => ({ ...d, remaining: remainingOf(d), due: dueInfo(d, txns) })),
    [debts, txns, remainingOf]
  );
  const activeDebts = debtsView.filter((d) => d.remaining > 0);

  const logout = async () => { await sb.auth.signOut(); };

  if (loading) return <div id="loading">جارٍ تحميل بياناتك…</div>;

  return (
    <div className="app">
      <header>
        <div>
          <h1>رصيدي</h1>
          <div className="sub">{session.user.email}</div>
        </div>
        <div className="head-actions">
          <button className="ghost" onClick={fetchAll}>↻</button>
          <button className="ghost" onClick={logout}>خروج</button>
        </div>
      </header>

      <div className="hero">
        <div className="hero-label">💵 رصيدك للصرف</div>
        <div className="hero-val" style={{ color: s.spendable >= 0 ? "#fff" : "#FCA5A5" }}>
          {fmt(s.spendable)} <span className="hero-cur">{CUR}</span>
        </div>
        <button className="hero-pot" onClick={() => setModal({ kind: "pot" })}>
          <span>💍 {POT_NAME}</span>
          <span><b>{fmt(s.pot)}</b> {CUR} ›</span>
        </button>
        <div className="hero-note">
          إجمالي السيولة {fmt(s.totalLiquid)} = المتاح للصرف + المدخر
        </div>
      </div>

      <div className="two-grid">
        <div className="mini">
          <div className="mini-head">💰 الادخار</div>
          <div className="mini-val" style={{ color: "#0E9F6E" }}>{fmt(s.savings)}</div>
          <div className="mini-sub">{SAVINGS_CAT} (يُخصم من الراتب)</div>
        </div>
        <div className="mini">
          <div className="mini-head">🏢 أصول ثابتة</div>
          <div className="mini-val" style={{ color: "#1C64F2" }}>{fmt(s.fixed)}</div>
          <div className="mini-sub">عقار · سيارة · أسهم (غير متاحة)</div>
        </div>
      </div>

      <div className="flow-grid">
        <Flow icon="📉" label="الدخل" value={fmt(s.income)} color="#0E9F6E" soft="#E3F5EC" />
        <Flow icon="📈" label="المصروف" value={fmt(s.expense)} color="#E02424" soft="#FDECEC" />
        <Flow icon="🔒" label="الالتزام الشهري" value={fmt(s.commitment)}
          color="#B45309" soft="#FEF3C7" onClick={() => setModal({ kind: "commits" })} />
      </div>

      <button className="paste-btn" onClick={() => setModal({ kind: "paste" })}>
        📋 لصق رسائل البنك
      </button>

      <div className="add-row">
        <button className="add-btn" style={{ background: SALARY_SOFT, color: SALARY_COLOR }}
          onClick={() => setModal({ kind: "salary" })}>＋راتب</button>
        {["income", "expense", "asset"].map((k) => (
          <button key={k} className="add-btn"
            style={{ background: TYPES[k].soft, color: TYPES[k].color }}
            onClick={() => setModal({ kind: "add", type: k })}>
            ＋{TYPES[k].label}
          </button>
        ))}
        <button className="add-btn" style={{ background: TYPES.debt.soft, color: TYPES.debt.color }}
          onClick={() => setModal({ kind: "newdebt" })}>＋قرض</button>
      </div>

      {activeDebts.length > 0 && (
        <button className="pay-btn" onClick={() => setModal({ kind: "pay" })}>💳 سداد قسط</button>
      )}

      {debtsView.length > 0 && (
        <div className="card-wrap">
          <div className="list-head"><span>القروض والديون</span></div>
          {debtsView.map((d) => {
            const rem = d.remaining;
            const P = Number(d.principal);
            const pct = P > 0 ? ((P - rem) / P) * 100 : 0;
            const done = rem <= 0;
            const col = done ? "#0E9F6E" : "#9061F9";
            return (
              <div className="debt-card" key={d.id}>
                <div className="debt-top">
                  <div>
                    <div className="debt-name">{d.name} {done && "✓"}</div>
                    <div className="debt-meta">{d.category} · قسط {fmt(d.monthly)} شهرياً</div>
                  </div>
                  <button className="del" onClick={() => removeDebt(d.id)}>🗑</button>
                </div>
                <div className="debt-nums">
                  <span>المتبقي <b style={{ color: col }}>{fmt(rem)}</b></span>
                  <span className="debt-of">من {fmt(P)}</span>
                </div>
                <div className="bar">
                  <div className="bar-fill" style={{ width: pct + "%", background: col }} />
                </div>
                <div className="debt-pct">سُدّد {pct.toFixed(0)}%</div>

                {!done && (
                  <div className="due-row">
                    <span className="due-pill" style={{ background: d.due.soft, color: d.due.color }}>
                      🗓 {d.due.text}

                    <button className="due-edit"
                      onClick={() => setModal({ kind: "dueday", debt: d })}>
                      يوم {d.due.day} من كل شهر ✏️
                    </button>

                )}
              </div>

        </div>
      )}

      <div className="card-wrap">
        <div className="list-head">
          <span>العمليات</span><span className="count">{txns.length}</span>
        </div>
        {txns.length === 0 ? (
          <div className="empty">ابدأ بإدخال رصيدك الحالي كأصل، ثم أضف قروضك وراتبك.</div>
        ) : txns.map((t) => {
          const m = TYPES[t.type];
          const isPot = !!t.pot;
          const color = isPot ? POT_COLOR : m.color;
          const soft = isPot ? POT_SOFT : m.soft;
          const icon = t.is_installment ? "💳" : isPot ? "💍" : m.icon;
          const title = t.pot === "in" ? "تحويل إلى المدخر"
            : t.pot === "out" ? "سحب من المدخر"
            : t.category + (t.is_installment ? " (قسط)" : "") + (t.pot === "pay" ? " — من المدخر" : "");
          const label = isPot ? "ادخار" : m.label;
          const sign = t.pot === "out" ? "+" : t.pot ? "−" : (m.sign > 0 ? "+" : "−");
          return (
            <div className="item" key={t.id}>
              <div className="item-icon" style={{ background: soft, color }}>{icon}</div>
              <div className="item-mid">
                <div className="item-cat">{title}</div>
                <div className="item-meta">{label} · {t.txn_date}{t.note ? " · " + t.note : ""}</div>

              <div className="item-amount" style={{ color }}>{sign}{fmt(t.amount)}</div>
              <button className="del" onClick={() => removeTxn(t)}>🗑</button>

      <div className="sync">☁ بياناتك محفوظة في السحابة وتُزامَن على كل أجهزتك</div>

      {modal?.kind === "paste" && (
        <PasteModal onClose={() => setModal(null)} onAddBatch={addBatch} />

      {modal?.kind === "add" && (
        <AddModal type={modal.type} pot={s.pot} onClose={() => setModal(null)} onAdd={addTxn} />
      )}
      {modal?.kind === "salary" && (
        <SalaryModal txns={txns} onClose={() => setModal(null)} onSave={addSalary} />
      )}
      {modal?.kind === "newdebt" && (
        <DebtModal onClose={() => setModal(null)} onAdd={addDebt} />
      )}
      {modal?.kind === "pay" && (
        <PayModal debts={activeDebts} onClose={() => setModal(null)} onPay={payInstallment} />
      )}
      {modal?.kind === "dueday" && (
        <DueDayModal debt={modal.debt} onClose={() => setModal(null)} onSave={saveDueDay} />
      )}
      {modal?.kind === "pot" && (
        <PotModal pot={s.pot} onClose={() => setModal(null)} onMove={movePot} />
      )}
      {modal?.kind === "commits" && (
        <CommitsModal items={commits} loans={s.commitLoans} err={commitErr} txns={txns}
          onClose={() => setModal(null)} onAdd={addCommit} onRemove={removeCommit}
          onPay={payCommit} />

// عمود البنود — معرَّف خارج النافذة عمداً حتى لا يفقد الحقل التركيز مع كل حرف
function SalaryCol({ list, head, bg, fg, isDed, onPatch, onDrop, onAdd }) {
  return (
    <div className="sal-col">
      <div className="sal-head" style={{ background: bg, color: fg }}>{head}</div>
      {list.map((r) => (
        <div className="bnd" key={r.id}>
          <div className="bnd-top">
            <input className="bnd-name" value={r.name} placeholder="الاسم"
              onChange={(e) => onPatch(r.id, { name: e.target.value })} />
            <button className="bnd-x" onClick={() => onDrop(r.id)}>✕</button>
          </div>
          <input className="bnd-amt" type="number" inputMode="decimal" value={r.amount}
            placeholder="0" onChange={(e) => onPatch(r.id, { amount: e.target.value })} />
          {isDed && (
            <button className="bnd-tg"
              onClick={() => onPatch(r.id, { toAsset: !r.toAsset })}
              style={r.toAsset
                ? { borderColor: "#0E9F6E", background: "#E3F5EC", color: "#0E9F6E" }
                : {}}>
              {r.toAsset ? "☑️ يُضاف للادخار" : "⬜️ يُضاف للادخار"}
            </button>
          )}
        </div>
      ))}
      <button className="bnd-add" onClick={onAdd}>＋ بند جديد</button>
    </div>

}

function SalaryModal({ txns, onClose, onSave }) {
  const prev = useMemo(() => lastSalary(txns), [txns]);
  const seed = useRef(0);
  const mk = useCallback((r) => ({
    id: "b" + (seed.current++),
    name: (r && r.name) || "",
    amount: (r && r.amount) || "",
    toAsset: !!(r && r.toAsset),
  }), []);

  const [inc, setInc] = useState(() =>
    prev && prev.income.length ? prev.income.map((r) => mk(r)) : [mk()]);
  const [ded, setDed] = useState(() =>
    prev && prev.expense.length ? prev.expense.map((r) => mk(r)) : [mk()]);
  const [date, setDate] = useState(today());
  const [busy, setBusy] = useState(false);

  const patch = (setter) => (id, ch) =>
    setter((p) => p.map((r) => (r.id === id ? { ...r, ...ch } : r)));
  const drop = (setter) => (id) =>
    setter((p) => (p.length > 1 ? p.filter((r) => r.id !== id)
                                : p.map((r) => ({ ...r, name: "", amount: "" }))));
  const push = (setter) => () => setter((p) => [...p, mk()]);

  const total = (list) => list.reduce((a, r) => a + (parseFloat(r.amount) || 0), 0);
  const gross = total(inc), deduct = total(ded);
  const net = gross - deduct;
  const toAssetSum = ded.filter((r) => r.toAsset).reduce((a, r) => a + (parseFloat(r.amount) || 0), 0);

  const month = String(date).slice(0, 7);
  const already = txns.some((t) => salaryMonthOf(t.note) === month);

  const clearAmounts = () => {
    setInc((p) => p.map((r) => ({ ...r, amount: "" })));
    setDed((p) => p.map((r) => ({ ...r, amount: "" })));
  };

  const submit = async () => {
    const clean = (list) => list
      .filter((r) => r.name.trim() && parseFloat(r.amount) > 0)
      .map((r) => ({ name: r.name.trim(), amount: parseFloat(r.amount), toAsset: r.toAsset }));
    const rows = { income: clean(inc), expense: clean(ded) };
    if (!rows.income.length && !rows.expense.length) return;
    setBusy(true);
    await onSave(rows, date);
    onClose();
  };

  return (
    <Shell title="💵 الراتب الشهري" color={SALARY_COLOR} soft={SALARY_SOFT} onClose={onClose}>
      {prev && (
        <div className="memo">
          📋 مُعبّأ من راتب {prev.month} — عدّل ما تغيّر فقط.
        </div>
      )}

      <div className="phint">
        أضف البنود بنفسك وسمِّ كل واحد. الخصم المؤشَّر بـ «يُضاف للادخار» يُسجَّل
        مرتين: خصم من السيولة، وإضافة لأصولك بنفس الاسم.
        <br />سمِّ خصم الادخار بالضبط «{SAVINGS_CAT}» ليظهر في بطاقة الادخار.
      </div>

      <label className="field">
        <span className="field-label">تاريخ الإيداع</span>
        <input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
      </label>

      {already && (
        <div className="pwarn" style={{ marginBottom: 14, fontSize: 12 }}>
          ⚠ سبق تسجيل راتب لشهر {month} — الحفظ الآن يضيف نسخة ثانية ويضاعف الأرقام.
        </div>
      )}

      <div className="sal-grid">
        <SalaryCol list={inc} head="＋ الدخل" bg="#E3F5EC" fg="#0E9F6E"
          onPatch={patch(setInc)} onDrop={drop(setInc)} onAdd={push(setInc)} />
        <SalaryCol list={ded} head="− الخصومات" bg="#FDECEC" fg="#E02424" isDed
          onPatch={patch(setDed)} onDrop={drop(setDed)} onAdd={push(setDed)} />
      </div>

      <button className="ghost" style={{ width: "100%", justifyContent: "center", marginTop: 6 }}
        onClick={clearAmounts}>🧹 تصفير المبالغ (مع بقاء الأسماء)</button>

      <div className="ssum">
        إجمالي الدخل: <b>{fmt(gross)}</b> {CUR}
        <br />
        الخصومات: <b>{fmt(deduct)}</b> {CUR}
        <br />
        الصافي المُودَع: <b>{fmt(net)}</b> {CUR}
        {toAssetSum > 0 && (
          <span style={{ display: "block", fontSize: 12, marginTop: 6, lineHeight: 1.7 }}>
            💰 سيُضاف {fmt(toAssetSum)} إلى أصولك تلقائياً
          </span>
        )}
        {net < 0 && (
          <span style={{ display: "block", fontSize: 12, color: "#E02424", marginTop: 6 }}>
            ⚠ الخصومات أكبر من الدخل — راجع الأرقام
          </span>
        )}
      </div>

      <button className="submit" style={{ background: SALARY_COLOR }} onClick={submit}
        disabled={busy || (gross <= 0 && deduct <= 0)}>
        {busy ? "جارٍ الحفظ…" : "حفظ الراتب"}
      </button>
    </Shell>
  );
}


// ═══════════════ نافذة لصق الرسائل ═══════════════
function PasteModal({ onClose, onAddBatch }) {
  const [text, setText] = useState("");
  const [rows, setRows] = useState([]);
  const [busy, setBusy] = useState(false);
  const [scanned, setScanned] = useState(false);

  const scan = (val) => {
    setText(val);
    const parsed = parseMany(val);
    setRows(parsed);
    setScanned(val.trim().length > 0);
  };

  const patch = (key, changes) =>
    setRows((p) => p.map((r) => (r.key === key ? { ...r, ...changes } : r)));

  const toggle = (key) =>
    setRows((p) => p.map((r) => (r.key === key ? { ...r, on: !r.on } : r)));

  const active = rows.filter((r) => r.on && Number(r.amount) > 0);

  const submit = async () => {
    if (!active.length) return;
    setBusy(true);
    await onAddBatch(active);
    onClose();
  };

  const pasteFromClipboard = async () => {
    try {
      const v = await navigator.clipboard.readText();
      if (v) scan(text ? text + "\n\n" + v : v);
    } catch (e) {
      // بعض المتصفحات تمنع القراءة — المستخدم يلصق يدوياً
    }
  };

  return (
    <Shell title="📋 لصق رسائل البنك" color="#1a1a2e" soft="#f2f1ee" onClose={onClose}>
      <div className="phint">
        الصق رسالة أو عدة رسائل دفعة واحدة (افصل بينها بسطر فارغ).
        سيستخرج التطبيق النوع والمبلغ والتاريخ والتصنيف تلقائياً — راجعها قبل الحفظ.
        <br />رسالة الراتب: استخدم زر «راتب» بدلاً من اللصق حتى تُفصَّل بنوده.
      </div>

      <label className="field">
        <span className="field-label">نص الرسائل</span>
        <textarea className="ta" value={text} autoFocus dir="auto"
          onChange={(e) => scan(e.target.value)}
          placeholder={"شراء نقاط بيع\nفيزا115.00 SAR\nرصيد1324.05\nلدىPERFECT\n2026-07-29 10:16"} />
      </label>

      <div className="row" style={{ marginBottom: 16 }}>
        <button className="ghost" style={{ flex: 1, justifyContent: "center" }}
          onClick={pasteFromClipboard}>📥 لصق من الحافظة</button>
        <button className="ghost" style={{ flex: 1, justifyContent: "center" }}
          onClick={() => { setText(""); setRows([]); setScanned(false); }}>🧹 مسح</button>
      </div>

      {scanned && rows.length === 0 && (
        <div className="auth-err">لم يُتعرَّف على أي عملية. تأكد أن الرسالة تحتوي مبلغاً بالريال (SAR أو SR).</div>
      )}

      {rows.length > 0 && (
        <div className="field">
          <span className="field-label">
            العمليات المستخرجة ({active.length} من {rows.length})
          </span>
          {rows.map((r) => {
            const m = TYPES[r.type];
            return (
              <div className={"pcard" + (r.on ? "" : " off")} key={r.key}>
                <div className="pcard-top">
                  <button className="pchk" onClick={() => toggle(r.key)}>
                    {r.on ? "☑️" : "⬜️"}
                  </button>
                  <div className="ptype">
                    {["income", "expense"].map((k) => (
                      <button key={k} className="ptype-btn"
                        onClick={() => patch(r.key, {
                          type: k,
                          category: CATS[k].includes(r.category) ? r.category : CATS[k][0],
                        })}
                        style={r.type === k
                          ? { background: TYPES[k].color, borderColor: TYPES[k].color, color: "#fff" }
                          : {}}>
                        {TYPES[k].label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pgrid">
                  <input className="pin" type="number" inputMode="decimal" value={r.amount}
                    onChange={(e) => patch(r.key, { amount: e.target.value })} />
                  <select className="psel" value={r.category}
                    onChange={(e) => patch(r.key, { category: e.target.value })}>
                    {CATS[r.type].map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <input className="pin" type="date" value={r.date}
                    onChange={(e) => patch(r.key, { date: e.target.value })} />
                  <input className="pin" value={r.note} placeholder="ملاحظة"
                    onChange={(e) => patch(r.key, { note: e.target.value })} />
                </div>

                {r.internal && (
                  <div className="pwarn">
                    ⚠ حوالة داخلية — إن كانت بين حساباتك أنت، الأفضل استبعادها
                    لأنها ليست دخلاً ولا مصروفاً حقيقياً.
                  </div>
                )}
                {!r.internal && r.note && <div className="pnote">{r.note}</div>}
              </div>
            );
          })}
        </div>
      )}

      <button className="submit" style={{ background: "#1a1a2e" }} onClick={submit}
        disabled={busy || active.length === 0}>
        {busy ? "جارٍ الحفظ…" : active.length ? "حفظ " + active.length + " عملية" : "لا توجد عمليات"}
      </button>
    </Shell>
  );
}


// ═══════════════ مكوّنات ═══════════════
function Flow({ icon, label, value, color, soft, onClick }) {
  const inner = (
    <React.Fragment>
      <div className="flow-icon" style={{ background: soft, color }}>{icon}</div>
      <div className="flow-label">{label}</div>
      <div className="flow-val" style={{ color }}>{value}</div>
    </React.Fragment>
  );
  if (onClick) return <button className="flow" onClick={onClick}>{inner}</button>;
  return <div className="flow">{inner}</div>;
}

function Shell({ title, color, soft, onClose, children }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-badge" style={{ background: soft, color }}>{title}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Chips({ items, value, onChange, color }) {
  return (
    <div className="chips">
      {items.map((c) => (
        <button key={c} className="chip" onClick={() => onChange(c)}
          style={value === c ? { background: color, borderColor: color, color: "#fff" } : {}}>
          {c}
        </button>

  );
}

function AddModal({ type, pot, onClose, onAdd }) {
  const m = TYPES[type];
  const [cat, setCat] = useState(CATS[type][0]);
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(today());
  const [note, setNote] = useState("");
  const [fromPot, setFromPot] = useState(false);
  const [busy, setBusy] = useState(false);

  const v = parseFloat(amount) || 0;

  const submit = async () => {
    if (!v || v <= 0) return;
    setBusy(true);
    await onAdd({ type, category: cat, amount: v, date, note: note.trim(),
                  pot: type === "expense" && fromPot ? "pay" : null });
    onClose();
  };

  return (
    <Shell title={"إضافة " + m.label} color={m.color} soft={m.soft} onClose={onClose}>
      <label className="field">
        <span className="field-label">المبلغ ({CUR})</span>
        <input className="input" type="number" inputMode="decimal" value={amount} autoFocus
          onChange={(e) => setAmount(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="0" />
      </label>
      <div className="field">
        <span className="field-label">التصنيف</span>
        <Chips items={CATS[type]} value={cat} onChange={setCat} color={m.color} />
      </div>

      {type === "expense" && (
        <button className="pot-toggle" onClick={() => setFromPot(!fromPot)}
          style={fromPot ? { borderColor: POT_COLOR, background: POT_SOFT, color: POT_COLOR } : {}}>
          {fromPot ? "☑️" : "⬜️"} 💍 ادفع من {POT_NAME}
        </button>
      )}

      {fromPot && (
        <div className="preview" style={{ background: POT_SOFT }}>
          يُخصم من المدخر — <b>رصيد الصرف لا يتأثر</b>.
          <br />
          <span style={{ fontSize: 12, color: v > pot ? "#E02424" : "#78716c" }}>
            {v > pot
              ? "⚠ المبلغ أكبر من المدخر (" + fmt(pot) + ") — سيصبح المدخر بالسالب"
              : "المدخر بعدها: " + fmt(pot - v) + " " + CUR}
          </span>
        </div>
      )}

      <label className="field">
        <span className="field-label">التاريخ</span>
        <input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
      </label>
      <label className="field">
        <span className="field-label">ملاحظة (اختياري)</span>
        <input className="input" value={note} onChange={(e) => setNote(e.target.value)} placeholder="تفاصيل إضافية" />
      </label>
      <button className="submit" style={{ background: m.color }} onClick={submit}
        disabled={busy || !v || v <= 0}>
        {busy ? "جارٍ الحفظ…" : "حفظ " + m.label}
      </button>
    </Shell>
  );
}

function PotModal({ pot, onClose, onMove }) {
  const [mode, setMode] = useState("in");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(today());
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);

  const v = parseFloat(amount) || 0;
  const after = mode === "in" ? pot + v : pot - v;
  const tooMuch = mode === "out" && v > pot;

  const submit = async () => {
    if (!v || v <= 0 || tooMuch) return;
    setBusy(true);
    await onMove(mode, v, date, note.trim());
    onClose();
  };

  return (
    <Shell title={"💍 " + POT_NAME} color={POT_COLOR} soft={POT_SOFT} onClose={onClose}>
      <div className="phint">
        المدخر جزء محجوز من رصيدك — يخرج من «رصيدك للصرف» ويبقى ضمن سيولتك.
        المصاريف العادية لا تمسّه.
      </div>

      <div className="preview" style={{ background: POT_SOFT }}>
        الرصيد المدخر حالياً: <b>{fmt(pot)}</b> {CUR}
      </div>

      <div className="auth-tabs">
        <button className={"auth-tab" + (mode === "in" ? " on" : "")}
          onClick={() => setMode("in")}>➕ تحويل للمدخر</button>
        <button className={"auth-tab" + (mode === "out" ? " on" : "")}
          onClick={() => setMode("out")}>➖ سحب للصرف</button>
      </div>

      <label className="field">
        <span className="field-label">المبلغ ({CUR})</span>
        <input className="input" type="number" inputMode="decimal" value={amount} autoFocus
          onChange={(e) => setAmount(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="0" />
      </label>
      <label className="field">
        <span className="field-label">التاريخ</span>
        <input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
      </label>
      <label className="field">
        <span className="field-label">ملاحظة (اختياري)</span>
        <input className="input" value={note} onChange={(e) => setNote(e.target.value)}
          placeholder={mode === "in" ? "ادخار الشهر" : "سبب السحب"} />
      </label>

      {v > 0 && (
        <div className="preview" style={{ background: tooMuch ? "#FDECEC" : "#f7f6f3" }}>
          {tooMuch
            ? "⚠ لا يمكن سحب أكثر من المدخر (" + fmt(pot) + ")"
            : "المدخر بعدها: " + fmt(after) + " " + CUR}
          {!tooMuch && (
            <span style={{ display: "block", fontSize: 12, color: "#78716c", marginTop: 4 }}>
              {mode === "in" ? "وينقص رصيد الصرف بنفس المبلغ" : "ويزيد رصيد الصرف بنفس المبلغ"}
            </span>
          )}
        </div>
      )}

      <button className="submit" style={{ background: POT_COLOR }} onClick={submit}
        disabled={busy || !v || v <= 0 || tooMuch}>
        {busy ? "جارٍ…" : mode === "in" ? "تحويل للمدخر" : "سحب للصرف"}
      </button>
    </Shell>
  );
}

function CommitsModal({ items, loans, err, txns, onClose, onAdd, onRemove, onPay }) {
  const [name, setName] = useState("");
  const [amount, setAmount] = useState("");
  const [day, setDay] = useState("");
  const [busy, setBusy] = useState(false);

  const [openId, setOpenId] = useState(null);
  const [payAmt, setPayAmt] = useState("");
  const [payDate, setPayDate] = useState(today());

  const thisMonth = today().slice(0, 7);
  const isPaid = (c) => txns.some((t) =>
    t.note === COMMIT_TAG + c.name && String(t.txn_date).slice(0, 7) === thisMonth);

  const openPay = (c) => {
    if (openId === c.id) return setOpenId(null);
    setOpenId(c.id);
    setPayAmt(String(Number(c.amount)));
    setPayDate(today());
  };

  const confirmPay = async (c) => {
    const v = parseFloat(payAmt);
    if (!v || v <= 0) return;
    setOpenId(null);
    await onPay(c, v, payDate);
  };

  const fixedTotal = items.reduce((a, c) => a + Number(c.amount), 0);
  const paidTotal = items.filter(isPaid).reduce((a, c) => a + Number(c.amount), 0);
  const v = parseFloat(amount) || 0;

  const submit = async () => {
    if (!name.trim() || !v || v <= 0) return;
    setBusy(true);
    const d = parseInt(day, 10);
    await onAdd({ name: name.trim(), amount: v,
                  due_day: d >= 1 && d <= 31 ? d : null });
    setName(""); setAmount(""); setDay(""); setBusy(false);
  };

  return (
    <Shell title="🔒 الالتزام الشهري" color="#B45309" soft="#FEF3C7" onClose={onClose}>
      {err && (
        <div className="auth-err">
          جدول الالتزامات غير موجود بعد — نفّذ خطوة Supabase أولاً (إنشاء جدول commitments).
        </div>
      )}

      <div className="csum">
        التزامات ثابتة: <b>{fmt(fixedTotal)}</b> {CUR}
        <br />
        أقساط القروض: <b>{fmt(loans)}</b> {CUR}
        <br />
        <span style={{ fontSize: 15, fontWeight: 800 }}>
          المجموع: {fmt(fixedTotal + loans)} {CUR} شهرياً
        </span>
        {items.length > 0 && (
          <span style={{ display: "block", fontSize: 12, marginTop: 4 }}>
            سُدّد هذا الشهر: {fmt(paidTotal)} · متبقٍّ {fmt(fixedTotal - paidTotal)}
          </span>
        )}
      </div>

      <div className="field">
        <span className="field-label">الالتزامات الثابتة ({items.length})</span>
        {items.length === 0 ? (
          <div className="phint">لا توجد التزامات بعد. أضف الإيجار والفواتير والاشتراكات المتكرّرة.</div>
        ) : items.map((c) => {
          const paid = isPaid(c);
          return (
            <div className="cbox" key={c.id}>
              <div className="cbox-top">
                <div style={{ minWidth: 0 }}>
                  <div className="crow-name">{c.name}</div>
                  <div className="crow-day">
                    {c.due_day ? "يوم " + c.due_day + " من كل شهر" : "بلا موعد محدد"}
                    {paid && " · ✓ سُدّد هذا الشهر"}
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                  <span className="crow-amount">{fmt(c.amount)}</span>
                  <button className={"cpay" + (paid ? " done" : "")} onClick={() => openPay(c)}>
                    {paid ? "✓ سدّد مرة أخرى" : "سدّد"}
                  </button>
                  <button className="del" onClick={() => onRemove(c.id)}>🗑</button>
                </div>
              </div>

              {openId === c.id && (
                <div className="cpay-form">
                  <div className="row" style={{ marginBottom: 9 }}>
                    <input className="input" type="number" inputMode="decimal" value={payAmt}
                      style={{ flex: 1 }} onChange={(e) => setPayAmt(e.target.value)} />
                    <input className="input" type="date" value={payDate}
                      style={{ flex: 1 }} onChange={(e) => setPayDate(e.target.value)} />
                  </div>
                  <button className="submit" style={{ background: "#E02424", padding: 12,
                    fontSize: 14, marginTop: 0 }} onClick={() => confirmPay(c)}
                    disabled={!parseFloat(payAmt) || parseFloat(payAmt) <= 0}>
                    تأكيد التسديد — يُخصم من رصيدك للصرف
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="field">
        <span className="field-label">إضافة التزام جديد</span>
        <input className="input" value={name} style={{ marginBottom: 8 }}
          onChange={(e) => setName(e.target.value)} placeholder="مثال: إيجار السكن" />
        <div className="row">
          <input className="input" type="number" inputMode="decimal" value={amount}
            style={{ flex: 2 }} onChange={(e) => setAmount(e.target.value)} placeholder="المبلغ" />
          <input className="input" type="number" inputMode="numeric" min="1" max="31" value={day}
            style={{ flex: 1 }} onChange={(e) => setDay(e.target.value)} placeholder="اليوم" />
        </div>
      </div>

      <button className="submit" style={{ background: "#B45309" }} onClick={submit}
        disabled={busy || !name.trim() || !v || v <= 0}>
        {busy ? "جارٍ…" : "＋ إضافة الالتزام"}
      </button>
    </Shell>
  );
}

function DebtModal({ onClose, onAdd }) {
  const m = TYPES.debt;
  const [name, setName] = useState("");
  const [cat, setCat] = useState(CATS.debt[0]);
  const [principal, setPrincipal] = useState("");
  const [monthly, setMonthly] = useState("");
  const [date, setDate] = useState(today());
  const [dueDay, setDueDay] = useState(String(new Date().getDate()));
  const [busy, setBusy] = useState(false);

  const cleanDay = Math.min(31, Math.max(1, parseInt(dueDay, 10) || 1));

  const submit = async () => {
    const p = parseFloat(principal);
    if (!p || p <= 0) return;
    setBusy(true);
    await onAdd({ name: name.trim() || cat, category: cat, principal: p,
                  monthly: parseFloat(monthly) || 0, date, due_day: cleanDay });
    onClose();
  };

  return (
    <Shell title="إضافة قرض" color={m.color} soft={m.soft} onClose={onClose}>
      <label className="field">
        <span className="field-label">اسم القرض</span>
        <input className="input" value={name} autoFocus
          onChange={(e) => setName(e.target.value)} placeholder="مثال: تمويل سيارة" />
      </label>
      <div className="field">
        <span className="field-label">النوع</span>
        <Chips items={CATS.debt} value={cat} onChange={setCat} color={m.color} />
      </div>
      <div className="row">
        <label className="field" style={{ flex: 1 }}>
          <span className="field-label">إجمالي القرض</span>
          <input className="input" type="number" inputMode="decimal" value={principal}
            onChange={(e) => setPrincipal(e.target.value)} placeholder="134500" />
        </label>
        <label className="field" style={{ flex: 1 }}>
          <span className="field-label">القسط الشهري</span>
          <input className="input" type="number" inputMode="decimal" value={monthly}
            onChange={(e) => setMonthly(e.target.value)} placeholder="2900" />
        </label>
      </div>
      <div className="row">
        <label className="field" style={{ flex: 1 }}>
          <span className="field-label">تاريخ البداية</span>
          <input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>
        <label className="field" style={{ flex: 1 }}>
          <span className="field-label">موعد القسط (يوم الشهر)</span>
          <input className="input" type="number" inputMode="numeric" min="1" max="31" value={dueDay}
            onChange={(e) => setDueDay(e.target.value)} placeholder="27" />
        </label>
      </div>
      <div className="phint">
        🗓 يُستقطع القسط يوم <b>{cleanDay}</b> من كل شهر. لو كان الشهر أقصر (فبراير مثلاً)
        يُحتسب آخر يوم فيه. والقسط الشهري يدخل ضمن «الالتزام الشهري».
      </div>
      <button className="submit" style={{ background: m.color }} onClick={submit}
        disabled={busy || !principal || parseFloat(principal) <= 0}>
        {busy ? "جارٍ…" : "إضافة القرض"}
      </button>
    </Shell>
  );
}

function DueDayModal({ debt, onClose, onSave }) {
  const [day, setDay] = useState(String(dayOfDebt(debt)));
  const [busy, setBusy] = useState(false);
  const cleanDay = Math.min(31, Math.max(1, parseInt(day, 10) || 1));

  const submit = async () => {
    setBusy(true);
    await onSave(debt.id, cleanDay);
    onClose();
  };

  return (
    <Shell title="موعد القسط" color="#9061F9" soft="#F0EAFE" onClose={onClose}>
      <div className="phint">
        {debt.name} — حدّد اليوم الذي يُستقطع فيه القسط من كل شهر.
      </div>
      <label className="field">
        <span className="field-label">يوم الشهر (من 1 إلى 31)</span>
        <input className="input" type="number" inputMode="numeric" min="1" max="31" value={day} autoFocus
          onChange={(e) => setDay(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
      </label>
      <div className="preview">
        القسط يوم <b>{cleanDay}</b> من كل شهر.
        <br />
        <span style={{ fontSize: 12, color: "#78716c" }}>
          لو كان الشهر أقصر (فبراير مثلاً) يُحتسب آخر يوم فيه.
        </span>
      </div>
      <button className="submit" style={{ background: "#9061F9" }} onClick={submit} disabled={busy}>
        {busy ? "جارٍ…" : "حفظ الموعد"}
      </button>
    </Shell>
  );
}

function PayModal({ debts, onClose, onPay }) {
  const [debtId, setDebtId] = useState(debts[0]?.id || "");
  const selected = debts.find((d) => d.id === debtId);
  const [amount, setAmount] = useState(String(debts[0]?.monthly || ""));
  const [date, setDate] = useState(today());
  const [busy, setBusy] = useState(false);

  const pick = (d) => { setDebtId(d.id); setAmount(String(d.monthly)); };

  const submit = async () => {
    const v = parseFloat(amount);
    if (!v || v <= 0 || !debtId) return;
    setBusy(true);
    await onPay(debtId, v, date);
    onClose();
  };

  return (
    <Shell title="سداد قسط" color="#9061F9" soft="#F0EAFE" onClose={onClose}>
      <div className="field">
        <span className="field-label">القرض</span>
        {debts.map((d) => (
          <button key={d.id} className="debt-opt" onClick={() => pick(d)}
            style={debtId === d.id ? { borderColor: "#9061F9", background: "#F0EAFE" } : {}}>
            <span style={{ display: "block", textAlign: "right" }}>
              <span style={{ fontWeight: 700, display: "block" }}>{d.name}</span>
              <span style={{ display: "block", fontSize: 11, marginTop: 3, color: d.due.color }}>
                🗓 {d.due.text}
              </span>
            </span>
            <span style={{ fontSize: 12, color: "#78716c" }}>متبقٍّ {fmt(d.remaining)}</span>
          </button>
        ))}
      </div>
      <label className="field">
        <span className="field-label">مبلغ القسط ({CUR})</span>
        <input className="input" type="number" inputMode="decimal" value={amount}
          onChange={(e) => setAmount(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
      </label>
      <label className="field">
        <span className="field-label">التاريخ</span>
        <input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
      </label>
      {selected && (
        <div className="preview">
          بعد السداد: المتبقي يصبح <b>{fmt(Math.max(0, selected.remaining - (parseFloat(amount) || 0)))}</b> {CUR}
          <br />
          <span style={{ fontSize: 12, color: "#78716c" }}>
            ويُخصم {fmt(parseFloat(amount) || 0)} من رصيدك للصرف
          </span>
        </div>
      )}
      <button className="submit" style={{ background: "#9061F9" }} onClick={submit}
        disabled={busy || !amount || parseFloat(amount) <= 0}>
        {busy ? "جارٍ…" : "تأكيد السداد"}
      </button>
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
