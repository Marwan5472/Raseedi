<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رصيدي">
<meta name="theme-color" content="#1a1a2e">
<title>رصيدي</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a2e'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='white'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI','Tahoma',system-ui,sans-serif; background: #F6F6F4; color: #1a1a1a;
    -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; }
  .app { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 60px; }
  input:focus { outline: 2px solid #9061F9; outline-offset: 1px; }
  button { font-family: inherit; }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 10px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { font-size: 12.5px; color: #78716c; margin-top: 4px; }
  .head-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .ghost { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 7px 11px;
    background: #fff; border: 1px solid #e5e5e0; border-radius: 9px; cursor: pointer; color: #44403c; font-weight: 600; }

  .hero { background: linear-gradient(135deg,#1a1a2e,#16213e); border-radius: 20px; padding: 20px 24px;
    color: #fff; margin-bottom: 12px; box-shadow: 0 10px 30px -12px rgba(26,26,46,.5); }
  .hero-label { display: flex; align-items: center; gap: 7px; font-size: 13px; opacity: .75; margin-bottom: 8px; }
  .hero-val { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .hero-cur { font-size: 16px; font-weight: 600; opacity: .7; }
  .hero-note { font-size: 11.5px; opacity: .6; margin-top: 10px; }

  .two-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .mini { background: #fff; border-radius: 15px; padding: 14px 15px; border: 1px solid #eeede9; }
  .mini-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #78716c; margin-bottom: 6px; font-weight: 600; }
  .mini-val { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .mini-sub { font-size: 10.5px; color: #a8a29e; margin-top: 4px; }

  .flow-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .flow { background: #fff; border-radius: 15px; padding: 13px 10px; border: 1px solid #eeede9; text-align: center; }
  .flow-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin: 0 auto 7px; font-size: 16px; }
  .flow-label { font-size: 11px; color: #78716c; margin-bottom: 3px; }
  .flow-val { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }

  .add-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .add-btn { display: flex; align-items: center; justify-content: center; gap: 3px; padding: 11px 3px;
    border-radius: 12px; border: none; cursor: pointer; font-size: 12.5px; font-weight: 700; }
  .pay-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px;
    border-radius: 12px; border: 1.5px solid #9061F9; background: #F0EAFE; color: #9061F9; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 16px; }

  .card-wrap { background: #fff; border-radius: 16px; border: 1px solid #eeede9; overflow: hidden; margin-bottom: 16px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #f2f1ee; }
  .count { font-size: 12px; background: #f2f1ee; padding: 2px 9px; border-radius: 20px; color: #78716c; }
  .empty { padding: 40px 24px; text-align: center; color: #a8a29e; font-size: 13.5px; line-height: 1.7; }

  .debt-card { padding: 14px 16px; border-bottom: 1px solid #f7f6f3; }
  .debt-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .debt-name { font-size: 14.5px; font-weight: 700; }
  .debt-meta { font-size: 11.5px; color: #a8a29e; margin-top: 2px; }
  .debt-nums { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; font-size: 13px; }
  .debt-of { font-size: 11.5px; color: #a8a29e; }
  .bar { height: 7px; background: #f2f1ee; border-radius: 20px; overflow: hidden; margin-top: 8px; }
  .bar-fill { height: 100%; border-radius: 20px; transition: width .4s ease; }
  .debt-pct { font-size: 11px; color: #78716c; margin-top: 5px; }

  .item { display: flex; align-items: center; gap: 11px; padding: 12px 16px; border-bottom: 1px solid #f7f6f3; }
  .item-icon { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; }
  .item-mid { flex: 1; min-width: 0; }
  .item-cat { font-size: 14px; font-weight: 600; }
  .item-meta { font-size: 11.5px; color: #a8a29e; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-amount { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; direction: ltr; }
  .del { background: none; border: none; cursor: pointer; color: #d6d3d1; padding: 5px; display: flex; font-size: 15px; }

  .overlay { position: fixed; inset: 0; background: rgba(20,20,30,.45); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 22px 22px 0 0; padding: 22px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding-bottom: max(22px, env(safe-area-inset-bottom)); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 10px; font-size: 14px; font-weight: 700; }
  .modal-close { background: #f2f1ee; border: none; border-radius: 9px; padding: 7px 10px; cursor: pointer; color: #57534e; font-size: 16px; }
  .field { display: block; margin-bottom: 16px; }
  .field-label { display: block; font-size: 12.5px; font-weight: 600; color: #57534e; margin-bottom: 7px; }
  .input { width: 100%; padding: 12px 13px; border-radius: 11px; border: 1.5px solid #e7e5e0; font-size: 16px; font-family: inherit; background: #faf9f7; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { padding: 8px 13px; border-radius: 20px; border: 1.5px solid #e7e5e0; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: #57534e; }
  .chip.active { color: #fff; }
  .row { display: flex; gap: 10px; }
  .debt-opt { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 14px; border-radius: 11px; border: 1.5px solid #e7e5e0; background: #fff; cursor: pointer; margin-bottom: 7px; }
  .debt-opt.active { border-color: #9061F9; background: #F0EAFE; }
  .preview { background: #F0EAFE; border-radius: 11px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; line-height: 1.7; color: #57534e; }
  .submit { width: 100%; padding: 14px; border-radius: 13px; border: none; color: #fff; font-size: 15.5px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .submit:disabled { opacity: .5; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 11px 22px; border-radius: 12px; font-size: 13.5px; font-weight: 600; z-index: 60; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>رصيدي</h1>
      <div class="sub">رصيدك الحقيقي · ثروتك · التزاماتك</div>
    </div>
    <div class="head-actions">
      <button class="ghost" onclick="exportData()">⬇ تصدير</button>
      <label class="ghost">⬆ استيراد<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
    </div>
  </header>

  <div class="hero">
    <div class="hero-label">💵 رصيدك الحقيقي (المتاح)</div>
    <div class="hero-val" id="liquidVal">0 <span class="hero-cur">ر.س</span></div>
    <div class="hero-note">نقد + بنك + الدخل − المصروف</div>
  </div>

  <div class="two-grid">
    <div class="mini">
      <div class="mini-head">⚖ صافي الثروة</div>
      <div class="mini-val" id="netWorth">0</div>
      <div class="mini-sub" id="netWorthSub">الأصول − الديون</div>
    </div>
    <div class="mini">
      <div class="mini-head">🏢 أصول ثابتة</div>
      <div class="mini-val" id="fixedAssets" style="color:#1C64F2">0</div>
      <div class="mini-sub">عقار · سيارة · استثمار (غير متاحة)</div>
    </div>
  </div>

  <div class="flow-grid">
    <div class="flow">
      <div class="flow-icon" style="background:#E3F5EC;color:#0E9F6E">📈</div>
      <div class="flow-label">الدخل</div>
      <div class="flow-val" id="income" style="color:#0E9F6E">0</div>
    </div>
    <div class="flow">
      <div class="flow-icon" style="background:#FDECEC;color:#E02424">📉</div>
      <div class="flow-label">المصروف</div>
      <div class="flow-val" id="expense" style="color:#E02424">0</div>
    </div>
    <div class="flow">
      <div class="flow-icon" style="background:#E3F5EC;color:#0E9F6E">🐷</div>
      <div class="flow-label">نسبة الادخار</div>
      <div class="flow-val" id="savings" style="color:#0E9F6E">0%</div>
    </div>
  </div>

  <div class="add-row">
    <button class="add-btn" style="background:#E3F5EC;color:#0E9F6E" onclick="openAdd('income')">＋ دخل</button>
    <button class="add-btn" style="background:#FDECEC;color:#E02424" onclick="openAdd('expense')">＋ مصروف</button>
    <button class="add-btn" style="background:#E5EEFE;color:#1C64F2" onclick="openAdd('asset')">＋ أصل</button>
    <button class="add-btn" style="background:#F0EAFE;color:#9061F9" onclick="openNewDebt()">＋ قرض</button>
  </div>

  <button class="pay-btn" id="payBtn" onclick="openPay()" style="display:none">💳 سداد قسط</button>

  <div class="card-wrap" id="debtsWrap" style="display:none">
    <div class="list-head"><span>القروض والديون</span></div>
    <div id="debtsList"></div>
  </div>

  <div class="card-wrap">
    <div class="list-head"><span>العمليات</span><span class="count" id="txnCount">0</span></div>
    <div id="txnList"><div class="empty">ابدأ بإدخال رصيدك الحالي كأصل، ثم أضف قروضك ودخلك.</div></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modalBody" onclick="event.stopPropagation()"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CUR = "ر.س";
const KEY = "raseedi_data_v1";
const LIQUID = ["نقد","حساب بنكي"];
const TYPES = {
  income:{label:"دخل",color:"#0E9F6E",soft:"#E3F5EC",sign:1,icon:"📈"},
  expense:{label:"مصروف",color:"#E02424",soft:"#FDECEC",sign:-1,icon:"📉"},
  asset:{label:"أصل",color:"#1C64F2",soft:"#E5EEFE",sign:1,icon:"👛"},
  debt:{label:"دين",color:"#9061F9",soft:"#F0EAFE",sign:-1,icon:"💳"},
};
const CATS = {
  income:["راتب","عمل حر","استثمار","هدية","أخرى"],
  expense:["إيجار","طعام","مواصلات","فواتير","تسوق","صحة","ترفيه","أخرى"],
  asset:["نقد","حساب بنكي","ودائع","استثمارات","عقار","سيارة","أخرى"],
  debt:["بطاقة ائتمان","قرض بنكي","تمويل سيارة","قرض عقاري","دين شخصي","أخرى"],
};
const fmt = n => new Intl.NumberFormat("ar-SA",{maximumFractionDigits:2}).format(Math.round((n||0)*100)/100);
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let state = { txns: [], debts: [] };

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch(e){}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("تعذّر الحفظ — صدّر نسخة احتياطية"); }
}

function calc() {
  const sum = (type,f=()=>true) => state.txns.filter(t=>t.type===type&&f(t)).reduce((a,t)=>a+ +t.amount,0);
  const income = sum("income"), expense = sum("expense");
  const liquidTx = sum("asset",t=>LIQUID.includes(t.category));
  const fixed = sum("asset",t=>!LIQUID.includes(t.category));
  const liquid = liquidTx + income - expense;
  const debtsRem = state.debts.reduce((a,d)=>a+d.remaining,0) + sum("debt");
  const totalAssets = liquid + fixed;
  return {
    income, expense, liquid, fixed, totalAssets, debtsRem,
    netWorth: totalAssets - debtsRem,
    savings: income>0 ? ((income-expense)/income)*100 : 0,
  };
}

function render() {
  const s = calc();
  document.getElementById("liquidVal").innerHTML = `${fmt(s.liquid)} <span class="hero-cur">${CUR}</span>`;
  document.getElementById("liquidVal").style.color = s.liquid>=0 ? "#fff" : "#FCA5A5";
  document.getElementById("netWorth").textContent = fmt(s.netWorth);
  document.getElementById("netWorth").style.color = s.netWorth>=0 ? "#0E9F6E" : "#E02424";
  document.getElementById("netWorthSub").textContent = `الأصول ${fmt(s.totalAssets)} − الديون ${fmt(s.debtsRem)}`;
  document.getElementById("fixedAssets").textContent = fmt(s.fixed);
  document.getElementById("income").textContent = fmt(s.income);
  document.getElementById("expense").textContent = fmt(s.expense);
  document.getElementById("savings").textContent = s.savings.toFixed(0)+"%";
  document.getElementById("savings").style.color = (s.income-s.expense)>=0 ? "#0E9F6E" : "#E02424";

  // ديون
  const dw = document.getElementById("debtsWrap");
  const pb = document.getElementById("payBtn");
  if (state.debts.length) {
    dw.style.display = "block";
    pb.style.display = state.debts.some(d=>d.remaining>0) ? "flex" : "none";
    document.getElementById("debtsList").innerHTML = state.debts.map(d=>{
      const pct = d.principal>0 ? ((d.principal-d.remaining)/d.principal)*100 : 0;
      const done = d.remaining<=0;
      const col = done ? "#0E9F6E" : "#9061F9";
      return `<div class="debt-card">
        <div class="debt-top">
          <div><div class="debt-name">${d.name} ${done?"✓":""}</div>
          <div class="debt-meta">${d.category} · قسط ${fmt(d.monthly)} شهرياً</div></div>
          <button class="del" onclick="removeDebt('${d.id}')">🗑</button>
        </div>
        <div class="debt-nums"><span>المتبقي <b style="color:${col}">${fmt(d.remaining)}</b></span>
        <span class="debt-of">من ${fmt(d.principal)}</span></div>
        <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <div class="debt-pct">سُدّد ${pct.toFixed(0)}%</div>
      </div>`;
    }).join("");
  } else { dw.style.display = "none"; pb.style.display = "none"; }

  // عمليات
  const items = [...state.txns].sort((a,b)=> b.date<a.date?-1:1);
  document.getElementById("txnCount").textContent = items.length;
  const tl = document.getElementById("txnList");
  if (!items.length) {
    tl.innerHTML = `<div class="empty">ابدأ بإدخال رصيدك الحالي كأصل، ثم أضف قروضك ودخلك.</div>`;
  } else {
    tl.innerHTML = items.map(t=>{
      const m = TYPES[t.type];
      const ic = t.isInstallment ? "💳" : m.icon;
      return `<div class="item">
        <div class="item-icon" style="background:${m.soft};color:${m.color}">${ic}</div>
        <div class="item-mid"><div class="item-cat">${t.category}${t.isInstallment?" (قسط)":""}</div>
        <div class="item-meta">${m.label} · ${t.date}${t.note?" · "+t.note:""}</div></div>
        <div class="item-amount" style="color:${m.color}">${m.sign>0?"+":"−"}${fmt(t.amount)}</div>
        <button class="del" onclick="removeTxn('${t.id}')">🗑</button>
      </div>`;
    }).join("");
  }
}

// ── عمليات ──
function addTxn(t){ state.txns.unshift({...t,id:uid()}); save(); render(); toast("تمت الإضافة"); }
function removeTxn(id){
  const t = state.txns.find(x=>x.id===id); if(!t) return;
  if (t.isInstallment && t.linkedDebt){
    const d = state.debts.find(x=>x.id===t.linkedDebt);
    if (d) d.remaining = Math.min(d.principal, d.remaining + t.amount);
  }
  state.txns = state.txns.filter(x=>x.id!==id); save(); render();
}
function addDebt(d){
  state.debts.unshift({id:uid(),name:d.name,category:d.category,principal:d.principal,remaining:d.principal,monthly:d.monthly,date:d.date});
  save(); render(); toast("تمت إضافة القرض");
}
function removeDebt(id){
  state.debts = state.debts.filter(d=>d.id!==id);
  state.txns = state.txns.filter(t=>t.linkedDebt!==id);
  save(); render();
}
function payInstallment(debtId, amount, date){
  const d = state.debts.find(x=>x.id===debtId); if(!d) return;
  const paid = Math.min(amount, d.remaining);
  d.remaining = Math.max(0, d.remaining - amount);
  state.txns.unshift({id:uid(),type:"expense",category:"قسط",amount:paid,date,note:d.name,linkedDebt:debtId,isInstallment:true});
  save(); render();
  toast(d.remaining<=0 ? "تم سداد القرض بالكامل 🎉" : "تم سداد القسط");
}

// ── نوافذ ──
let sel = {};
function openModal(html){ document.getElementById("modalBody").innerHTML = html; document.getElementById("overlay").classList.add("show"); }
function closeModal(e){ if(!e || e.target.id==="overlay") document.getElementById("overlay").classList.remove("show"); }
function doClose(){ document.getElementById("overlay").classList.remove("show"); }

function openAdd(type){
  const m = TYPES[type]; sel = {type, category: CATS[type][0]};
  const chips = CATS[type].map(c=>`<button class="chip ${c===sel.category?'active':''}" style="${c===sel.category?`background:${m.color};border-color:${m.color}`:''}" onclick="pickCat('${c}',this,'${m.color}')">${c}</button>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-badge" style="background:${m.soft};color:${m.color}">إضافة ${m.label}</div>
    <button class="modal-close" onclick="doClose()">✕</button></div>
    <label class="field"><span class="field-label">المبلغ (${CUR})</span>
    <input class="input" id="amt" type="number" inputmode="decimal" placeholder="0" autofocus></label>
    <div class="field"><span class="field-label">التصنيف</span><div class="chips">${chips}</div></div>
    <label class="field"><span class="field-label">التاريخ</span><input class="input" id="date" type="date" value="${today()}"></label>
    <label class="field"><span class="field-label">ملاحظة (اختياري)</span><input class="input" id="note" placeholder="تفاصيل إضافية"></label>
    <button class="submit" style="background:${m.color}" onclick="submitAdd()">حفظ ${m.label}</button>
  `);
}
function pickCat(c, el, color){
  sel.category = c;
  document.querySelectorAll('.chip').forEach(x=>{x.classList.remove('active');x.style.background='';x.style.borderColor='';});
  el.classList.add('active'); el.style.background=color; el.style.borderColor=color;
}
function submitAdd(){
  const v = parseFloat(document.getElementById("amt").value);
  if(!v||v<=0) return;
  addTxn({type:sel.type,category:sel.category,amount:v,date:document.getElementById("date").value,note:document.getElementById("note").value.trim()});
  doClose();
}

function openNewDebt(){
  const m = TYPES.debt; sel = {category: CATS.debt[0]};
  const chips = CATS.debt.map(c=>`<button class="chip ${c===sel.category?'active':''}" style="${c===sel.category?`background:${m.color};border-color:${m.color}`:''}" onclick="pickCat('${c}',this,'${m.color}')">${c}</button>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-badge" style="background:${m.soft};color:${m.color}">إضافة قرض</div>
    <button class="modal-close" onclick="doClose()">✕</button></div>
    <label class="field"><span class="field-label">اسم القرض</span><input class="input" id="dname" placeholder="مثال: تمويل سيارة" autofocus></label>
    <div class="field"><span class="field-label">النوع</span><div class="chips">${chips}</div></div>
    <div class="row">
      <label class="field" style="flex:1"><span class="field-label">إجمالي القرض</span><input class="input" id="dprin" type="number" inputmode="decimal" placeholder="134500"></label>
      <label class="field" style="flex:1"><span class="field-label">القسط الشهري</span><input class="input" id="dmon" type="number" inputmode="decimal" placeholder="2900"></label>
    </div>
    <label class="field"><span class="field-label">تاريخ البداية</span><input class="input" id="ddate" type="date" value="${today()}"></label>
    <button class="submit" style="background:${m.color}" onclick="submitDebt()">إضافة القرض</button>
  `);
}
function submitDebt(){
  const p = parseFloat(document.getElementById("dprin").value);
  const mo = parseFloat(document.getElementById("dmon").value)||0;
  if(!p||p<=0) return;
  const name = document.getElementById("dname").value.trim() || sel.category;
  addDebt({name,category:sel.category,principal:p,monthly:mo,date:document.getElementById("ddate").value});
  doClose();
}

function openPay(){
  const debts = state.debts.filter(d=>d.remaining>0);
  if(!debts.length) return;
  sel = {debtId: debts[0].id};
  const opts = debts.map(d=>`<button class="debt-opt ${d.id===sel.debtId?'active':''}" onclick="pickDebt('${d.id}',${d.monthly},this)"><span style="font-weight:700">${d.name}</span><span style="font-size:12px;color:#78716c">متبقٍّ ${fmt(d.remaining)}</span></button>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-badge" style="background:#F0EAFE;color:#9061F9">سداد قسط</div>
    <button class="modal-close" onclick="doClose()">✕</button></div>
    <div class="field"><span class="field-label">القرض</span><div>${opts}</div></div>
    <label class="field"><span class="field-label">مبلغ القسط (${CUR})</span><input class="input" id="pamt" type="number" inputmode="decimal" value="${debts[0].monthly}" oninput="updatePreview()"></label>
    <label class="field"><span class="field-label">التاريخ</span><input class="input" id="pdate" type="date" value="${today()}"></label>
    <div class="preview" id="preview"></div>
    <button class="submit" style="background:#9061F9" onclick="submitPay()">تأكيد السداد</button>
  `);
  updatePreview();
}
function pickDebt(id, monthly, el){
  sel.debtId = id;
  document.querySelectorAll('.debt-opt').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById("pamt").value = monthly;
  updatePreview();
}
function updatePreview(){
  const d = state.debts.find(x=>x.id===sel.debtId); if(!d) return;
  const amt = parseFloat(document.getElementById("pamt").value)||0;
  document.getElementById("preview").innerHTML = `بعد السداد: المتبقي يصبح <b>${fmt(Math.max(0,d.remaining-amt))}</b> ${CUR}<br><span style="font-size:12px;color:#78716c">ويُخصم ${fmt(amt)} من رصيدك السائل</span>`;
}
function submitPay(){
  const amt = parseFloat(document.getElementById("pamt").value);
  if(!amt||amt<=0||!sel.debtId) return;
  payInstallment(sel.debtId, amt, document.getElementById("pdate").value);
  doClose();
}

// ── تصدير / استيراد ──
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=`نسخة-مالية-${today()}.json`; a.click();
  URL.revokeObjectURL(url); toast("تم التصدير");
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); state = {txns:d.txns||[],debts:d.debts||[]}; save(); render(); toast("تم الاستيراد"); } catch { toast("ملف غير صالح"); } };
  r.readAsText(f); e.target.value="";
}

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"),2600);
}

load(); render();
</script>
</body>
</html>
